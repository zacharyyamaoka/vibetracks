<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="light" />
  <title>Vibe Tracks</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%23f9f7f1'/%3E%3Cpath d='M3 4h2l3 8 3-8h2l-4 10H7z' fill='%231c1c1a'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div class="brand">
        <span class="brand-word">Vibe Tracks</span>
        <span class="brand-sub" id="descriptor-label">Loading project…</span>
      </div>
      <nav class="view-switcher" aria-label="Project view">
        <button data-view="graph" class="active">Graph</button>
        <button data-view="kanban">Kanban</button>
        <button data-view="focus">Focus</button>
      </nav>
      <div class="sync-state"><span class="sync-mark" aria-hidden="true">●</span><span id="sync-label">reading files</span></div>
    </header>

    <section class="project-head">
      <div class="project-intro">
        <p class="eyebrow">File-first feature system</p>
        <h1 id="project-title">Vibe Tracks</h1>
        <p id="project-description" class="project-description"></p>
      </div>
      <div class="project-metrics" id="project-metrics"></div>
    </section>

    <section class="filters">
      <label class="search"><span aria-hidden="true">⌕</span><input id="search" type="search" placeholder="Search features, areas, and ids" /></label>
      <div class="area-filters" id="area-filters"></div>
      <label class="archive-toggle"><input id="show-archived" type="checkbox" /> Show archive</label>
    </section>

    <main class="workspace">
      <aside class="feature-rail">
        <div class="rail-head"><span>Features</span><span id="visible-count">0</span></div>
        <div id="feature-list" class="feature-list"></div>
      </aside>
      <section class="view-stage" id="view-stage" aria-live="polite"></section>
      <aside class="detail-panel" id="detail-panel"></aside>
    </main>
  </div>
  <div class="toast" id="toast" role="status"></div>
  <script src="/app.js" defer></script>
</body>
</html>
