<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="light dark" />
  <title>Vibe Tracks</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div class="brand"><span class="brand-mark">VT</span><div><strong>Vibe Tracks</strong><span id="descriptor-label">Loading project…</span></div></div>
      <nav class="view-switcher" aria-label="Project view">
        <button data-view="graph" class="active">Graph</button>
        <button data-view="kanban">Kanban</button>
        <button data-view="focus">Focus</button>
      </nav>
      <div class="sync-state"><span class="sync-dot"></span><span id="sync-label">Reading files</span></div>
    </header>

    <section class="project-head">
      <div><p class="eyebrow">FILE-FIRST FEATURE SYSTEM</p><h1 id="project-title">Vibe Tracks</h1><p id="project-description"></p></div>
      <div class="project-metrics" id="project-metrics"></div>
    </section>

    <section class="filters">
      <label class="search"><span>⌕</span><input id="search" type="search" placeholder="Search features, areas, and IDs" /></label>
      <div class="area-filters" id="area-filters"></div>
      <label class="archive-toggle"><input id="show-archived" type="checkbox" /> Show archive</label>
    </section>

    <main class="workspace">
      <aside class="feature-rail">
        <div class="rail-head"><strong>Feature conversations</strong><span id="visible-count">0</span></div>
        <div id="feature-list" class="feature-list"></div>
      </aside>
      <section class="view-stage" id="view-stage" aria-live="polite"></section>
      <aside class="detail-panel" id="detail-panel"></aside>
    </main>
  </div>
  <div class="toast" id="toast" role="status"></div>
  <script src="/app.js" defer></script>
</body>
</html>
