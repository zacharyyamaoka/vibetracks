[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vibetracks"
version = "0.3.0"
description = "File-first feature tracking: Markdown notes rendered as Graph, Kanban, and Focus views, with a dispatcher protocol for AI agents."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["PyYAML>=6.0"]

[project.urls]
Repository = "https://github.com/zacharyyamaoka/vibetracks"

[project.scripts]
vibetracks = "vibetracks.cli:main"

[tool.setuptools]
packages = {find = {include = ["vibetracks*"]}}

[tool.setuptools.package-data]
vibetracks = ["static/*", "AGENT.md"]
"vibetracks.roadmap" = ["*.json"]
